name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        modules: 'qtnetworkauth'

    - name: Configure CMake
      shell: bash
      run: |
        mkdir build
        cd build
        cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        cmake --build . -j4 --config Release

    - name: Get version
      id: get_version
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=v1.0.0" >> $GITHUB_OUTPUT
        fi

    - name: Sign executable
      shell: pwsh
      run: |
        # Create self-signed certificate
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=TanmoyTheBoT" -CertStoreLocation Cert:\CurrentUser\My

        # Export and import to Trusted Root to establish chain
        $certPath = "Cert:\CurrentUser\My\$($cert.Thumbprint)"
        $tempCert = "$env:TEMP\tempcert.cer"
        Export-Certificate -Cert $certPath -FilePath $tempCert
        Import-Certificate -FilePath $tempCert -CertStoreLocation Cert:\CurrentUser\Root

        # Sign with timestamp
        $signResult = Set-AuthenticodeSignature -FilePath "bin\TOTPManager-*.exe" -Certificate (Get-Item $certPath) -TimestampServer "http://timestamp.digicert.com"

        # Verify signature
        Write-Host "Signature Status: $($signResult.Status)"
        if ($signResult.Status -ne 'Valid') {
          Write-Warning "Signature status: $($signResult.Status) - $($signResult.StatusMessage)"
        }

    - name: Package
      shell: bash
      run: |
        mkdir release
        cp bin/TOTPManager-*.exe release/
        cd release
        7z a TOTPManager-${{ steps.get_version.outputs.VERSION }}-win64.zip TOTPManager-*.exe

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          release/*.zip
          release/*.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TOTPManager-Windows-x64
        path: release/
